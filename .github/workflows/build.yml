name: Build IPTV Master Playlist

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build master playlist
        run: |
          chmod +x build-master.sh
          ./build-master.sh

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add playlists/master.m3u
          git commit -m "Update master playlist" || echo "No changes"
          git push